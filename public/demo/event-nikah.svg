<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-label="Illustration of an open book on a wooden stand beneath a pointed arch, with two rings">
  <defs>
    <linearGradient id="nk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05201A"/>
      <stop offset="46%" stop-color="#0D3A30"/>
      <stop offset="78%" stop-color="#1A5C4A"/>
      <stop offset="100%" stop-color="#07271F"/>
    </linearGradient>
    <radialGradient id="nk-glow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#F2DFA8" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#F2DFA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nk-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2DA9C"/>
      <stop offset="50%" stop-color="#D9AC53"/>
      <stop offset="100%" stop-color="#B98B36"/>
    </linearGradient>
    <radialGradient id="nk-vig" cx="50%" cy="44%" r="70%">
      <stop offset="52%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04180F" stop-opacity="0.62"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1600" fill="url(#nk-sky)"/>
  <circle cx="450" cy="680" r="450" fill="url(#nk-glow)"/>

  <!-- A pointed arch framing the whole composition -->
  <path d="M150 1240 L 150 560 C 150 350, 290 210, 450 210 C 610 210, 750 350, 750 560 L 750 1240"
        fill="none" stroke="url(#nk-gold)" stroke-width="8" opacity="0.72"/>
  <path d="M194 1240 L 194 572 C 194 384, 318 258, 450 258 C 582 258, 706 384, 706 572 L 706 1240"
        fill="none" stroke="url(#nk-gold)" stroke-width="3" opacity="0.4"/>

  <!-- Hanging lantern -->
  <path d="M450 210 L 450 300" stroke="url(#nk-gold)" stroke-width="4" opacity="0.7"/>
  <path d="M414 300 L 486 300 L 472 378 L 428 378 Z" fill="url(#nk-gold)" opacity="0.85"/>
  <circle cx="450" cy="338" r="14" fill="#FFF7DC"/>
  <circle cx="450" cy="338" r="40" fill="#FFE9B0" opacity="0.28"/>

  <!-- Floor -->
  <path d="M-20 1180 C 220 1140, 680 1140, 920 1180 L 920 1600 L -20 1600 Z" fill="#05231B"/>
  <path d="M-20 1180 C 220 1140, 680 1140, 920 1180" fill="none" stroke="#2A6A56" stroke-width="4" opacity="0.5"/>

  <!-- Rehal: the folding stand, an X seen from the front -->
  <g>
    <ellipse cx="450" cy="1200" rx="230" ry="30" fill="#03140E" opacity="0.5"/>
    <path d="M262 1194 L 438 862 L 474 862 L 298 1194 Z" fill="#6B3A1E"/>
    <path d="M638 1194 L 462 862 L 426 862 L 602 1194 Z" fill="#8A4C27"/>
    <rect x="400" y="1000" width="100" height="18" rx="7" fill="#5A2F17"/>
  </g>

  <!-- The open book -->
  <g>
    <path d="M186 862 C 280 800, 402 792, 448 836 L 448 862 Z" fill="#0B3B2E"/>
    <path d="M714 862 C 620 800, 498 792, 452 836 L 452 862 Z" fill="#0B3B2E"/>
    <path d="M198 858 C 288 800, 398 794, 448 836 L 448 876 C 398 840, 288 848, 204 896 Z" fill="#FBF5E6"/>
    <path d="M702 858 C 612 800, 502 794, 452 836 L 452 876 C 502 840, 612 848, 696 896 Z" fill="#F2EAD5"/>
    <g fill="none" stroke="#D9CDB2" stroke-width="4">
      <path d="M204 896 C 288 848, 398 840, 448 876"/>
      <path d="M210 918 C 292 872, 398 864, 448 898"/>
    </g>
    <g fill="none" stroke="#CFC2A6" stroke-width="4">
      <path d="M696 896 C 612 848, 502 840, 452 876"/>
      <path d="M690 918 C 608 872, 502 864, 452 898"/>
    </g>
    <!-- Abstracted lines of text, never rendered as actual scripture -->
    <g stroke="#1A5C4A" stroke-width="6" opacity="0.5" stroke-linecap="round">
      <path d="M254 862 L 412 830"/><path d="M262 888 L 412 856"/><path d="M272 914 L 412 882"/>
      <path d="M646 862 L 488 830"/><path d="M638 888 L 488 856"/><path d="M628 914 L 488 882"/>
    </g>
    <path d="M446 820 L 454 820 L 454 906 L 446 906 Z" fill="url(#nk-gold)" opacity="0.8"/>
  </g>

  <!-- Two rings resting on the floor in front -->
  <g fill="none" stroke="url(#nk-gold)" stroke-width="11">
    <circle cx="386" cy="1116" r="40"/>
    <circle cx="462" cy="1132" r="34"/>
  </g>
  <circle cx="386" cy="1076" r="9" fill="#FFF7DC"/>

  <rect width="900" height="1600" fill="url(#nk-vig)"/>
</svg>
