<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-label="Illustration of a dholak drum being played beneath string lights on an evening courtyard">
  <!--
    Phone-shaped on purpose. Event artwork is shown full-bleed behind a portrait
    viewport, so a landscape source would be cropped to a narrow central strip.
    Everything that matters sits in the middle band, clear of the bottom third
    where the template lays its gradient and type.
  -->
  <defs>
    <linearGradient id="dh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22102B"/>
      <stop offset="42%" stop-color="#4B2038"/>
      <stop offset="72%" stop-color="#8A3E38"/>
      <stop offset="100%" stop-color="#3A1A2C"/>
    </linearGradient>
    <radialGradient id="dh-glow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FFC978" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFC978" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dh-drum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A3520"/>
      <stop offset="34%" stop-color="#CC7038"/>
      <stop offset="72%" stop-color="#A8542A"/>
      <stop offset="100%" stop-color="#6B2E1C"/>
    </linearGradient>
    <radialGradient id="dh-vig" cx="50%" cy="46%" r="70%">
      <stop offset="52%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#160A1C" stop-opacity="0.62"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1600" fill="url(#dh-sky)"/>
  <circle cx="450" cy="740" r="470" fill="url(#dh-glow)"/>

  <!-- Two swags of string lights -->
  <path d="M-20 200 C 220 320, 680 320, 920 200" fill="none" stroke="#E8B46A" stroke-width="4" opacity="0.6"/>
  <path d="M-20 320 C 240 450, 660 450, 920 320" fill="none" stroke="#E8B46A" stroke-width="3" opacity="0.4"/>
  <g fill="#FFD98F">
    <circle cx="80" cy="248" r="12"/><circle cx="210" cy="292" r="13"/><circle cx="340" cy="314" r="12"/>
    <circle cx="470" cy="316" r="13"/><circle cx="600" cy="302" r="12"/><circle cx="730" cy="272" r="13"/>
    <circle cx="850" cy="232" r="12"/>
  </g>
  <g fill="#FFEBBF" opacity="0.6">
    <circle cx="150" cy="392" r="9"/><circle cx="300" cy="432" r="9"/><circle cx="450" cy="444" r="9"/>
    <circle cx="600" cy="430" r="9"/><circle cx="750" cy="386" r="9"/>
  </g>

  <!-- A single marigold strand hanging at each side, so it never reads as more lights -->
  <g>
    <path d="M96 0 L 96 300" stroke="#C9762A" stroke-width="3" opacity="0.5"/>
    <path d="M804 0 L 804 300" stroke="#C9762A" stroke-width="3" opacity="0.5"/>
    <g fill="#EE9A3C">
      <circle cx="96" cy="44" r="20"/><circle cx="96" cy="112" r="19"/><circle cx="96" cy="176" r="17"/><circle cx="96" cy="236" r="14"/>
      <circle cx="804" cy="44" r="20"/><circle cx="804" cy="112" r="19"/><circle cx="804" cy="176" r="17"/><circle cx="804" cy="236" r="14"/>
    </g>
    <g fill="#C9762A" opacity="0.55">
      <circle cx="96" cy="44" r="7"/><circle cx="96" cy="112" r="7"/><circle cx="96" cy="176" r="6"/>
      <circle cx="804" cy="44" r="7"/><circle cx="804" cy="112" r="7"/><circle cx="804" cy="176" r="6"/>
    </g>
  </g>

  <!-- Floor, established before the drum so the drum can stand on it -->
  <path d="M-20 1060 C 220 1016, 680 1016, 920 1060 L 920 1600 L -20 1600 Z" fill="#33162A"/>
  <path d="M-20 1060 C 220 1016, 680 1016, 920 1060" fill="none" stroke="#6E3040" stroke-width="4" opacity="0.5"/>

  <!--
    An upright drum played from the top. A horizontal barrel read as a cart with
    wheels: the side heads looked like discs bolted to the ends, and there was no
    clear playing surface for the hands to sit on.
  -->
  <g>
    <!-- contact shadow, directly beneath -->
    <ellipse cx="450" cy="1148" rx="212" ry="34" fill="#160A1C" opacity="0.55"/>

    <!-- body, tapering slightly toward the floor -->
    <path d="M276 690 L 624 690 L 592 1140 L 308 1140 Z" fill="url(#dh-drum)"/>
    <!-- a darker side plane so it reads as a cylinder -->
    <path d="M540 690 L 624 690 L 592 1140 L 520 1140 Z" fill="#5E2718" opacity="0.4"/>

    <!-- the head: the playing surface -->
    <ellipse cx="450" cy="690" rx="174" ry="58" fill="#F4E3C4"/>
    <ellipse cx="450" cy="690" rx="174" ry="58" fill="none" stroke="#6B2E1C" stroke-width="8"/>
    <ellipse cx="450" cy="700" rx="104" ry="34" fill="#D6A874" opacity="0.4"/>
    <circle cx="450" cy="700" r="40" fill="#8A5A34" opacity="0.45"/>

    <!-- lacing down the body -->
    <g stroke="#F4E3C4" stroke-width="6" opacity="0.7">
      <path d="M320 730 L 338 1128"/><path d="M386 744 L 392 1136"/><path d="M450 748 L 450 1140"/>
      <path d="M514 744 L 508 1136"/><path d="M580 730 L 562 1128"/>
    </g>
    <!-- brass tension rings -->
    <g fill="none" stroke="#E8B46A" stroke-width="8" opacity="0.85">
      <path d="M300 858 C 380 884, 520 884, 600 858"/>
      <path d="M292 1000 C 374 1028, 526 1028, 608 1000"/>
    </g>
  </g>

  <!-- Two hands resting on the head, one either side of centre -->
  <g fill="#E8B183">
    <!-- left -->
    <path d="M300 624 C 272 606, 258 640, 276 664 C 292 686, 330 694, 356 680 C 372 670, 372 646, 356 636 Z"/>
    <g stroke="#C98F62" stroke-width="5" fill="none" opacity="0.65">
      <path d="M292 652 L 322 676"/><path d="M312 640 L 338 668"/><path d="M334 634 L 350 660"/>
    </g>
    <!-- right -->
    <path d="M600 624 C 628 606, 642 640, 624 664 C 608 686, 570 694, 544 680 C 528 670, 528 646, 544 636 Z"/>
    <g stroke="#C98F62" stroke-width="5" fill="none" opacity="0.65">
      <path d="M608 652 L 578 676"/><path d="M588 640 L 562 668"/><path d="M566 634 L 550 660"/>
    </g>
  </g>

  <!-- A scatter of petals on the floor -->
  <g fill="#EE9A3C" opacity="0.55">
    <ellipse cx="170" cy="1230" rx="24" ry="14"/><ellipse cx="730" cy="1250" rx="24" ry="14"/>
    <ellipse cx="290" cy="1330" rx="19" ry="11"/><ellipse cx="620" cy="1312" rx="19" ry="11"/>
  </g>

  <rect width="900" height="1600" fill="url(#dh-vig)"/>
</svg>
