<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Illustrated portrait of a bride in a gold-bordered dupatta with traditional jewellery">

  <defs>
    <linearGradient id="bride-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4E7DA"/>
      <stop offset="58%" stop-color="#E9D2C2"/>
      <stop offset="100%" stop-color="#DCBFAC"/>
    </linearGradient>

    <radialGradient id="bride-halo" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#FFF8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8F0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bride-veil" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#B8455C"/>
      <stop offset="55%" stop-color="#A33A50"/>
      <stop offset="100%" stop-color="#8B2F44"/>
    </linearGradient>

    <linearGradient id="bride-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2DA9C"/>
      <stop offset="50%" stop-color="#D9AC53"/>
      <stop offset="100%" stop-color="#B98B36"/>
    </linearGradient>

    <filter id="bride-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <radialGradient id="bride-vig" cx="50%" cy="48%" r="72%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3A2018" stop-opacity="0.34"/>
    </radialGradient>
  </defs>

  <!-- Ground -->
  <rect width="900" height="1200" fill="url(#bride-ground)"/>
  <circle cx="450" cy="455" r="330" fill="url(#bride-halo)"/>

  <!-- Decorative arch, echoing the invitation's own ornament -->
  <path d="M 196 1200 L 196 512 C 196 286 330 182 450 182 C 570 182 704 286 704 512 L 704 1200 Z"
        fill="none" stroke="#C08C74" stroke-width="2" opacity="0.45"/>

  <!-- Scattered motia buds -->
  <g fill="#FFFDF8" opacity="0.7">
    <circle cx="188" cy="360" r="9"/><circle cx="208" cy="392" r="6"/>
    <circle cx="712" cy="404" r="9"/><circle cx="690" cy="368" r="6"/>
    <circle cx="164" cy="628" r="7"/><circle cx="736" cy="654" r="7"/>
  </g>

  <!-- ================= Figure ================= -->

  <!-- Blouse and shoulders -->
  <path d="M 214 1200 C 226 890 322 700 450 700 C 578 700 674 890 686 1200 Z" fill="#8B2F44"/>
  <path d="M 214 1200 C 226 890 322 700 450 700 C 578 700 674 890 686 1200 Z" fill="none" stroke="#6E2035" stroke-width="2" opacity="0.5"/>

  <!-- Gold hem across the blouse -->
  <path d="M 246 966 C 316 902 584 902 654 966" fill="none" stroke="url(#bride-gold)" stroke-width="7" opacity="0.85"/>
  <path d="M 240 996 C 314 930 586 930 660 996" fill="none" stroke="url(#bride-gold)" stroke-width="3" opacity="0.6"/>

  <!-- Dupatta, the layer that sits behind the head -->
  <path d="M 232 1200 C 236 860 252 660 306 520 C 348 404 396 344 450 344 C 504 344 552 404 594 520 C 648 660 664 860 668 1200 Z"
        fill="url(#bride-veil)"/>

  <!-- Neck -->
  <path d="M 410 588 L 490 588 L 496 706 L 404 706 Z" fill="#E7B491"/>
  <path d="M 410 588 L 490 588 L 490 620 C 468 644 432 644 410 620 Z" fill="#D9A07C" opacity="0.85"/>

  <!-- Head -->
  <ellipse cx="450" cy="486" rx="108" ry="126" fill="#F3C9A6"/>
  <!-- Cheek shading -->
  <ellipse cx="450" cy="510" rx="104" ry="100" fill="#EFBF98" opacity="0.45"/>

  <!-- Hair at the parting, just visible under the dupatta -->
  <path d="M 352 452 C 366 392 400 366 450 366 C 500 366 534 392 548 452 C 512 420 388 420 352 452 Z" fill="#2E1C16"/>
  <path d="M 450 366 L 450 424" stroke="#1F120E" stroke-width="3" opacity="0.6"/>

  <!-- Brows: thin, high, and clearly separated from the eyes -->
  <path d="M 386 462 C 400 452 420 452 432 458" fill="none" stroke="#3A241B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 468 458 C 480 452 500 452 514 462" fill="none" stroke="#3A241B" stroke-width="5" stroke-linecap="round"/>

  <!-- Eyes, with the gaze carried a little low -->
  <ellipse cx="406" cy="500" rx="19" ry="14" fill="#FFFFFF"/>
  <ellipse cx="494" cy="500" rx="19" ry="14" fill="#FFFFFF"/>
  <circle cx="406" cy="504" r="9" fill="#33211A"/>
  <circle cx="494" cy="504" r="9" fill="#33211A"/>
  <circle cx="403" cy="500" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="491" cy="500" r="3" fill="#FFFFFF" opacity="0.9"/>

  <!-- Upper lids and a few outer lashes -->
  <path d="M 387 494 C 396 486 416 486 425 493" fill="none" stroke="#2B1A14" stroke-width="5" stroke-linecap="round"/>
  <path d="M 475 493 C 484 486 504 486 513 494" fill="none" stroke="#2B1A14" stroke-width="5" stroke-linecap="round"/>
  <path d="M 387 492 L 379 485" stroke="#2B1A14" stroke-width="4" stroke-linecap="round"/>
  <path d="M 513 492 L 521 485" stroke="#2B1A14" stroke-width="4" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="380" cy="540" rx="26" ry="15" fill="#E08C86" opacity="0.4"/>
  <ellipse cx="520" cy="540" rx="26" ry="15" fill="#E08C86" opacity="0.4"/>

  <!-- Nose: a small shadow, nothing more -->
  <path d="M 450 522 L 450 542" fill="none" stroke="#D49A76" stroke-width="4" stroke-linecap="round"/>
  <path d="M 442 548 C 446 552 454 552 458 548" fill="none" stroke="#C99475" stroke-width="4" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M 430 572 C 440 580 460 580 470 572 C 462 590 438 590 430 572 Z" fill="#BE5462"/>

  <!-- Nath, set beside the nose and clear of the mouth -->
  <circle cx="418" cy="544" r="10" fill="none" stroke="url(#bride-gold)" stroke-width="3.5"/>

  <!-- ================= Dupatta front drape ================= -->

  <!-- Crown of the scarf, laid over the hairline -->
  <path d="M 336 486 C 336 392 384 330 450 330 C 516 330 564 392 564 486
           C 540 420 502 392 450 392 C 398 392 360 420 336 486 Z"
        fill="url(#bride-veil)"/>

  <!-- The two falls, coming forward over the shoulders -->
  <path d="M 336 486 C 320 640 300 850 292 1200 L 214 1200 C 224 880 254 636 306 512 Z" fill="#9C3650"/>
  <path d="M 564 486 C 580 640 600 850 608 1200 L 686 1200 C 676 880 646 636 594 512 Z" fill="#9C3650"/>

  <!-- Gold borders on every dupatta edge -->
  <path d="M 336 486 C 336 392 384 330 450 330 C 516 330 564 392 564 486"
        fill="none" stroke="url(#bride-gold)" stroke-width="9"/>
  <path d="M 306 512 C 254 636 224 880 214 1200" fill="none" stroke="url(#bride-gold)" stroke-width="8" opacity="0.9"/>
  <path d="M 594 512 C 646 636 676 880 686 1200" fill="none" stroke="url(#bride-gold)" stroke-width="8" opacity="0.9"/>
  <path d="M 292 1200 C 300 850 320 640 336 486" fill="none" stroke="url(#bride-gold)" stroke-width="6" opacity="0.75"/>
  <path d="M 608 1200 C 600 850 580 640 564 486" fill="none" stroke="url(#bride-gold)" stroke-width="6" opacity="0.75"/>

  <!-- Embroidery dots on the veil -->
  <g fill="#F2DA9C" opacity="0.72">
    <circle cx="366" cy="432" r="5"/><circle cx="414" cy="384" r="5"/>
    <circle cx="486" cy="384" r="5"/><circle cx="534" cy="432" r="5"/>
    <circle cx="322" cy="640" r="5"/><circle cx="578" cy="640" r="5"/>
    <circle cx="308" cy="790" r="5"/><circle cx="592" cy="790" r="5"/>
    <circle cx="252" cy="700" r="4"/><circle cx="648" cy="700" r="4"/>
  </g>

  <!-- ================= Jewellery ================= -->

  <!-- Maang tikka, hung at the parting -->
  <path d="M 450 330 L 450 368" stroke="url(#bride-gold)" stroke-width="4"/>
  <circle cx="450" cy="386" r="16" fill="url(#bride-gold)"/>
  <circle cx="450" cy="386" r="7" fill="#8B2F44"/>
  <path d="M 450 402 L 444 418 L 456 418 Z" fill="url(#bride-gold)"/>

  <!-- Jhumka earrings -->
  <g>
    <circle cx="344" cy="536" r="11" fill="url(#bride-gold)"/>
    <path d="M 326 552 C 330 586 358 586 362 552 Z" fill="url(#bride-gold)"/>
    <circle cx="332" cy="596" r="5" fill="#D9AC53"/><circle cx="344" cy="600" r="5" fill="#D9AC53"/><circle cx="356" cy="596" r="5" fill="#D9AC53"/>
  </g>
  <g>
    <circle cx="556" cy="536" r="11" fill="url(#bride-gold)"/>
    <path d="M 538 552 C 542 586 570 586 574 552 Z" fill="url(#bride-gold)"/>
    <circle cx="544" cy="596" r="5" fill="#D9AC53"/><circle cx="556" cy="600" r="5" fill="#D9AC53"/><circle cx="568" cy="596" r="5" fill="#D9AC53"/>
  </g>

  <!-- Layered necklace -->
  <path d="M 386 702 C 412 740 488 740 514 702" fill="none" stroke="url(#bride-gold)" stroke-width="8"/>
  <path d="M 368 710 C 404 778 496 778 532 710" fill="none" stroke="url(#bride-gold)" stroke-width="6" opacity="0.9"/>
  <circle cx="450" cy="770" r="18" fill="url(#bride-gold)"/>
  <circle cx="450" cy="770" r="8" fill="#8B2F44"/>
  <g fill="url(#bride-gold)">
    <circle cx="406" cy="752" r="6"/><circle cx="428" cy="764" r="6"/>
    <circle cx="472" cy="764" r="6"/><circle cx="494" cy="752" r="6"/>
  </g>

  <!-- Finish -->
  <rect width="900" height="1200" fill="url(#bride-vig)"/>
  <rect width="900" height="1200" filter="url(#bride-grain)" opacity="0.05"/>
</svg>
